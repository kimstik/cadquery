name: Downstream compatibility

on:
  workflow_dispatch:
    inputs:
      projects:
        description: Comma-separated inventory IDs, empty for all
        required: false
        default: ''
      runner:
        description: Environment for the selected scenarios
        type: choice
        options:
          - ubuntu-22.04
          - windows-2022
        default: ubuntu-22.04
      python:
        description: Python version for both comparison variants
        type: choice
        options:
          - '3.11'
          - '3.12'
        default: '3.11'

env:
  COMPAT_PROJECTS: ${{ inputs.projects }}

permissions:
  contents: read

concurrency:
  group: downstream-compat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-22.04
    outputs:
      projects: ${{ steps.matrix.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: matrix
        run: python .github/compat/run.py matrix >> "$GITHUB_OUTPUT"

  compare:
    needs: inventory
    runs-on: ${{ inputs.runner || 'ubuntu-22.04' }}
    timeout-minutes: 110
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        project: ${{ fromJSON(needs.inventory.outputs.projects) }}
    name: Project ${{ matrix.project }}
    env:
      QT_QPA_PLATFORM: offscreen
      LIBGL_ALWAYS_SOFTWARE: '1'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python || '3.11' }}
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libglu1-mesa libegl1 libxrender1 libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 libxkbcommon0 libfontconfig1 xvfb xauth
      - name: Compare unchanged consumer on base and PR
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            python .github/compat/run.py project ${{ matrix.project }}
          else
            nice -n 19 python .github/compat/run.py project ${{ matrix.project }}
          fi
      - name: Save results, dependency lock and full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downstream-${{ matrix.project }}
          path: compat-results/
          if-no-files-found: error
          retention-days: 14

  report:
    if: always() && needs.inventory.result == 'success'
    needs: [inventory, compare]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: downstream-*
          path: compat-results
          merge-multiple: true
      - name: Summarize every inventory entry
        run: python .github/compat/run.py report
